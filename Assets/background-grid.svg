<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Small grid pattern (40px cells) -->
    <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(113, 170, 255, 0.08)" stroke-width="0.5"/>
    </pattern>
    <!-- Large grid pattern (200px cells) -->
    <pattern id="largeGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#smallGrid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(113, 170, 255, 0.15)" stroke-width="1"/>
    </pattern>
    <!-- Radial fade mask so edges are softer -->
    <radialGradient id="fadeMask" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="vignette">
      <rect width="1920" height="1080" fill="url(#fadeMask)"/>
    </mask>
    <!-- Accent glow -->
    <radialGradient id="accentGlow" cx="65%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#71AAFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#71AAFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f2f2f2"/>

  <!-- Subtle accent glow -->
  <rect width="1920" height="1080" fill="url(#accentGlow)"/>

  <!-- Grid with vignette fade -->
  <rect width="1920" height="1080" fill="url(#largeGrid)" mask="url(#vignette)"/>

  <!-- Subtle dot accents at major intersections -->
  <g fill="rgba(113, 170, 255, 0.12)">
    <!-- Row 1 -->
    <circle cx="200" cy="200" r="2.5"/>
    <circle cx="400" cy="200" r="2.5"/>
    <circle cx="600" cy="200" r="2.5"/>
    <circle cx="800" cy="200" r="2.5"/>
    <circle cx="1000" cy="200" r="2.5"/>
    <circle cx="1200" cy="200" r="2.5"/>
    <circle cx="1400" cy="200" r="2.5"/>
    <circle cx="1600" cy="200" r="2.5"/>
    <!-- Row 2 -->
    <circle cx="200" cy="400" r="2.5"/>
    <circle cx="400" cy="400" r="2.5"/>
    <circle cx="600" cy="400" r="2.5"/>
    <circle cx="800" cy="400" r="2.5"/>
    <circle cx="1000" cy="400" r="2.5"/>
    <circle cx="1200" cy="400" r="2.5"/>
    <circle cx="1400" cy="400" r="2.5"/>
    <circle cx="1600" cy="400" r="2.5"/>
    <!-- Row 3 -->
    <circle cx="200" cy="600" r="2.5"/>
    <circle cx="400" cy="600" r="2.5"/>
    <circle cx="600" cy="600" r="2.5"/>
    <circle cx="800" cy="600" r="2.5"/>
    <circle cx="1000" cy="600" r="2.5"/>
    <circle cx="1200" cy="600" r="2.5"/>
    <circle cx="1400" cy="600" r="2.5"/>
    <circle cx="1600" cy="600" r="2.5"/>
    <!-- Row 4 -->
    <circle cx="200" cy="800" r="2.5"/>
    <circle cx="400" cy="800" r="2.5"/>
    <circle cx="600" cy="800" r="2.5"/>
    <circle cx="800" cy="800" r="2.5"/>
    <circle cx="1000" cy="800" r="2.5"/>
    <circle cx="1200" cy="800" r="2.5"/>
    <circle cx="1400" cy="800" r="2.5"/>
    <circle cx="1600" cy="800" r="2.5"/>
  </g>

  <!-- Highlighted cross-hair accent lines -->
  <g stroke="rgba(113, 170, 255, 0.1)" stroke-width="1" stroke-dasharray="6 4">
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>
</svg>
